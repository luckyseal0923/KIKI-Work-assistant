# KIKI only: reuse existing networks; never create or alter the shared database.
services:
  kiki:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:?Set APP_MODE}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Set LINE_CHANNEL_SECRET securely}
      PORT: ${PORT:-3000}
      ALLOWED_GROUP_ID: ${ALLOWED_GROUP_ID:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-linebot_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_TLS: ${DB_TLS:-verify-full}
      DB_CA_FILE: ${DB_CA_FILE:-}
      DB_PRIVATE_NETWORK_CONFIRMED: ${DB_PRIVATE_NETWORK_CONFIRMED:-false}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_FREEFORM_ENABLED: ${ASSISTANT_FREEFORM_ENABLED:-false}
      ASSISTANT_WORKSPACE_ENABLED: ${ASSISTANT_WORKSPACE_ENABLED:-false}
      ASSISTANT_ORGANIZER_ENABLED: ${ASSISTANT_ORGANIZER_ENABLED:-false}
      ASSISTANT_MULTI_GROUP_ENABLED: ${ASSISTANT_MULTI_GROUP_ENABLED:-false}
      ASSISTANT_MAX_GROUPS: ${ASSISTANT_MAX_GROUPS:-3}
      ASSISTANT_CONTEXT_MESSAGES: ${ASSISTANT_CONTEXT_MESSAGES:-20}
      ASSISTANT_CONTEXT_CHARACTERS: ${ASSISTANT_CONTEXT_CHARACTERS:-12000}
      OPERATOR_USER_ID: ${OPERATOR_USER_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ASSISTANT_MAX_MESSAGES: ${ASSISTANT_MAX_MESSAGES:-100}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-20}
      ASSISTANT_COOLDOWN_SECONDS: ${ASSISTANT_COOLDOWN_SECONDS:-30}
    expose:
      - "${PORT:-3000}"
    networks:
      - coolify_proxy
      - supabase_private
    # The image's Node-based HEALTHCHECK remains in force.

networks:
  coolify_proxy:
    external: true
    name: coolify
  supabase_private:
    external: true
    name: ${SUPABASE_DOCKER_NETWORK:?Set the existing Supabase stack network name}
